function ic(n, s) {
  s = s || 20;
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[n] || '') + '</svg>';
}
function hydrate(root) {
  var els = (root || document).querySelectorAll('i[data-ic]');
  for (var i = 0; i < els.length; i++) {
    if (els[i].getAttribute('data-done')) continue;
    els[i].innerHTML = ic(els[i].getAttribute('data-ic'), +(els[i].getAttribute('data-s') || 20));
    els[i].setAttribute('data-done', '1');
  }
}

// ==================== UTIL ====================
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// Argumen aman untuk atribut onclick: menghasilkan string literal JS yang di-escape
function arg(s) {
  return esc("'" + String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'");
}
function sid(s) { return String(s == null ? '' : s).replace(/[^A-Za-z0-9_-]/g, '_'); }
function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
function rp(n) { return 'Rp ' + num(n).toLocaleString('id-ID'); }
function shortRp(v) {
  v = num(v);
  if (v >= 1e9) return parseFloat((v / 1e9).toFixed(1)) + 'M';
  if (v >= 1e6) return parseFloat((v / 1e6).toFixed(1)) + 'jt';
  if (v >= 1e3) return parseFloat((v / 1e3).toFixed(0)) + 'rb';
  return String(v);
}
function pad2(n) { return ('0' + n).slice(-2); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dmyToYmd(s) { var m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
function parseDT(s) {
  var m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) : null;
}
function relTime(s) {
  var d = parseDT(s);
  if (!d) return esc(s);
  var mnt = Math.floor((Date.now() - d.getTime()) / 60000);
  if (mnt < 1) return 'Baru saja';
  if (mnt < 60) return mnt + ' menit lalu';
  if (mnt < 1440) return Math.floor(mnt / 60) + ' jam lalu';
  if (mnt < 10080) return Math.floor(mnt / 1440) + ' hari lalu';
  return String(s).slice(0, 10);
}
function tglPanjang(d) { return HARI_P[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); }
function hijri(d) {
  try { return new Intl.DateTimeFormat('id-ID-u-ca-islamic', { day: 'numeric', month: 'long', year: 'numeric' }).format(d); } catch (e) { return ''; }
}
function salam() {
  var h = new Date().getHours();
  if (h < 11) return 'Selamat Pagi';
  if (h < 15) return 'Selamat Siang';
  if (h < 18) return 'Selamat Sore';
  return 'Selamat Malam';
}
function salamEmoji() { var h = new Date().getHours(); return h < 11 ? '☀️' : h < 15 ? '🌤️' : h < 18 ? '🌇' : '🌙'; }
function debounce(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }
function sget(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
function sset(k, v) { try { if (v === null) window.sessionStorage.removeItem(k); else window.sessionStorage.setItem(k, v); } catch (e) { } }
function radioVal(name) { var r = document.querySelector('input[name="' + name + '"]:checked'); return r ? r.value : ''; }

var PALET = [['#E9F7EF', '#1F7A4D'], ['#EEF0FF', '#4F46E5'], ['#FDECEF', '#D63B50'], ['#FFF1E0', '#C26A12'], ['#E6F2FA', '#1D6FA5'], ['#F3EDFF', '#7C3AED']];
function warna(s) { var h = 0; s = String(s || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997; return PALET[h % PALET.length]; }
function inisial(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?').charAt(0) + (p[1] ? p[1].charAt(0) : '')).toUpperCase(); }
// Avatar: tampilkan foto profil jika ada (File ID Drive / data URL), selain itu inisial nama
function av(nama, size, foto) {
  var c = warna(nama);
  var st = 'background:' + c[0] + ';color:' + c[1] + (size ? ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.36) + 'px' : '');
  var isi = esc(inisial(nama));
  if (foto) isi = '<img src="' + esc(imgSrc(foto, 200)) + '" alt="" loading="lazy" data-fid="' + esc(foto) + '" data-ini="' + esc(inisial(nama)) + '" onerror="imgFallback(this)">';
  return '<span class="av" style="' + st + '" title="' + esc(nama) + '">' + isi + '</span>';
}

// ==================== GAMBAR DRIVE ====================
var IMG = { cache: {}, wait: {} };
function imgSrc(id, w) {
  if (!id) return '';
  if (/^data:/.test(id)) return id;
  if (IMG.cache[id]) return IMG.cache[id];
  return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 400);
}
// Jika link publik diblokir (akun Workspace), ambil gambar lewat backend (base64)
function imgFallback(el) {
  var id = el.getAttribute('data-fid');
  var gagal = function () {
    var ini = el.getAttribute('data-ini');
    if (ini !== null && el.parentNode) el.parentNode.textContent = ini;
    else el.style.visibility = 'hidden';
  };
  if (!id || el.getAttribute('data-fb') || S.preview || /^data:/.test(id)) { gagal(); return; }
  el.setAttribute('data-fb', '1');
  if (IMG.cache[id]) { el.src = IMG.cache[id]; return; }
  if (IMG.wait[id]) { IMG.wait[id].push(el); return; }
  IMG.wait[id] = [el];
  api('getGambar', [S.token, id], function (url) {
    IMG.cache[id] = url;
    (IMG.wait[id] || []).forEach(function (x) { x.src = url; });
    delete IMG.wait[id];
  }, function () {
    (IMG.wait[id] || []).forEach(function (x) {
      var ini = x.getAttribute('data-ini');
      if (ini !== null && x.parentNode) x.parentNode.textContent = ini; else x.style.visibility = 'hidden';
    });
    delete IMG.wait[id];
  }, true);
}
function driveView(id) { return 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view'; }
function gabung(a, b) { var o = {}; Object.keys(a || {}).forEach(function (k) { o[k] = a[k]; }); Object.keys(b || {}).forEach(function (k) { o[k] = b[k]; }); return o; }
function kv(k, v) { return '<div class="kv"><span>' + esc(k) + '</span><b>' + v + '</b></div>'; }

// ==================== UPLOADER GAMBAR (kompres di HP sebelum kirim) ====================
var UPL = {};
function kompresGambar(file, opt, ok) {
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
      if (opt.square) { var m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = m; sh = m; w = m; h = m; }
      var skala = Math.min(1, opt.max / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * skala)), ch = Math.max(1, Math.round(h * skala));
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      var url = cv.toDataURL('image/jpeg', 0.82);
      if (url.length > 6500000) url = cv.toDataURL('image/jpeg', 0.6);
      ok(url);
    };
    img.onerror = function () { toast('Format gambar tidak didukung. Gunakan foto JPG/PNG.', 'err'); };
    img.src = r.result;
  };
  r.onerror = function () { toast('Gagal membaca file gambar', 'err'); };
  r.readAsDataURL(file);
}
function cekFileGambar(f) {
  if (!f) return false;
  if (!/^image\//.test(f.type)) { toast('File harus berupa gambar (JPG/PNG)', 'warn'); return false; }
  if (f.size > 15 * 1024 * 1024) { toast('Ukuran foto terlalu besar (maks 15 MB)', 'warn'); return false; }
  return true;
}
function uplHtml(k, hint) {
  return '<div class="upl" id="upl-' + k + '">' +
    '<input type="file" accept="image/*" id="uplf-' + k + '" class="hidden" onchange="uplPilih(' + arg(k) + ',this)">' +
    '<button type="button" class="upl-drop" onclick="document.getElementById(' + arg('uplf-' + k) + ').click()">' + ic('camera', 26) + '<b>Ambil foto / pilih dari galeri</b><small>' + esc(hint || 'JPG / PNG • otomatis dikompres') + '</small></button>' +
    '<div class="upl-prev hidden"><img alt="Preview struk"><button type="button" class="icon-btn sm" onclick="uplHapus(' + arg(k) + ')" aria-label="Hapus foto">' + ic('x', 14) + '</button><small class="upl-info"></small></div>' +
    '</div>';
}
function uplPilih(k, input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!cekFileGambar(f)) return;
  var box = $('upl-' + k);
  var info = box.querySelector('.upl-info');
  kompresGambar(f, { max: 1280 }, function (url) {
    UPL[k] = url;
    box.querySelector('.upl-drop').classList.add('hidden');
    box.querySelector('.upl-prev').classList.remove('hidden');
    box.querySelector('.upl-prev img').src = url;
    info.textContent = f.name + ' • ' + Math.round(url.length * 0.75 / 1024) + ' KB (sudah dikompres)';
  });
}
function uplHapus(k) {
  UPL[k] = '';
  var box = $('upl-' + k);
  if (!box) return;
  box.querySelector('.upl-drop').classList.remove('hidden');
  box.querySelector('.upl-prev').classList.add('hidden');
  box.querySelector('.upl-prev img').removeAttribute('src');
}

// ==================== FOTO PROFIL ====================
function formFoto() {
  $('meDrop').classList.add('hidden');
  if (S.preview) { toast('Mode preview: fitur aktif setelah deploy', 'info'); return; }
  UPL.foto = '';
  var f = '<div class="foto-edit"><div id="fotoPrev">' + av(S.user.nama, 120, S.user.foto) + '</div>' +
    '<input type="file" accept="image/*" id="fotoFile" class="hidden" onchange="fotoPilih(this)">' +
    '<button type="button" class="btn btn-soft" onclick="document.getElementById(' + arg('fotoFile') + ').click()">' + ic('camera', 16) + 'Pilih Foto</button>' +
    '<p class="hint" style="text-align:center;margin:0">Foto otomatis dipotong persegi &amp; dikompres (400px).</p></div>';
  openModal('Foto Profil', f, { foot: '<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-pri" id="btnFoto" disabled onclick="simpanFoto()">Simpan Foto</button>' });
}
function fotoPilih(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!cekFileGambar(f)) return;
  kompresGambar(f, { max: 400, square: true }, function (url) {
    UPL.foto = url;
    $('fotoPrev').innerHTML = av(S.user.nama, 120, url);
    $('btnFoto').disabled = false;
  });
}
function setFotoSaya(f) {
  S.user.foto = f || '';
  if (S.user.role === 'Admin') $('meAv').innerHTML = av(S.user.nama, null, S.user.foto);
  else {
    $('pAv').innerHTML = av(S.user.nama, 38, S.user.foto);
    if (S.pdash) S.pdash.user.Foto_Profil = S.user.foto;
    if (!$('ps-profil').classList.contains('hidden')) renderProfil();
  }
}
function simpanFoto() {
  var url = UPL.foto;
  if (!url) return;
  var lama = S.user.foto;
  closeModal();
  // Optimistic UI: foto langsung tampil, dikembalikan jika upload gagal
  setFotoSaya(url);
  toast('Mengunggah foto profil...', 'info');
  api('uploadFotoProfil', [S.token, url], function (r) {
    IMG.cache[r.foto] = url;
    setFotoSaya(r.foto);
    toast('Foto profil diperbarui 📸', 'ok');
  }, function () { setFotoSaya(lama); });
}
var BADGE = {
  'Lunas': ['b-grn', 'Lunas'], 'Aktif': ['b-grn', 'Aktif'], 'Sudah Dicairkan': ['b-grn', 'Dicairkan'],
  'Menunggu Verifikasi': ['b-org', 'Menunggu'], 'Belum Dicairkan': ['b-org', 'Belum Cair'],
  'Ditolak': ['b-red', 'Ditolak'], 'Belum Bayar': ['b-red', 'Belum Bayar'], 'Nonaktif': ['b-gray', 'Nonaktif'],
  'Selesai': ['b-pur', 'Selesai'], 'Menyimpan': ['b-gray', 'Menyimpan...'], 'Belum Setor': ['b-red', 'Belum Setor']
};
function badge(st) { var b = BADGE[st] || ['b-gray', st || '-']; return '<span class="badge ' + b[0] + '">' + esc(b[1]) + '</span>'; }
function skel(n) {
  var h = '';
  for (var i = 0; i < (n || 4); i++) h += '<div class="sk-row"><div class="sk sk-c"></div><div style="flex:1"><div class="sk" style="width:' + (40 + (i * 13) % 40) + '%"></div><div class="sk" style="width:25%;margin-top:8px"></div></div></div>';
  return h;
}
function emptyState(msg, icon) { return '<div class="empty">' + ic(icon || 'list', 30) + '<p>' + esc(msg) + '</p></div>'; }

// ==================== TOAST & MODAL ====================
function toast(msg, type) {
  type = type || 'info';
  var icn = { ok: 'check', err: 'alert', warn: 'alert', info: 'info' }[type] || 'info';
  var t = document.createElement('div');
  t.className = 'toast t-' + type;
  t.innerHTML = ic(icn, 18) + '<span>' + esc(msg) + '</span>';
  $('toasts').appendChild(t);
  setTimeout(function () { t.classList.add('show'); }, 20);
  setTimeout(function () { t.classList.remove('show'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 400); }, 3800);
}
function openModal(title, body, opts) {
  opts = opts || {};
  if (!opts.keepVw) S.vw = null;
  $('mTitle').textContent = title;

// silent = true: error tidak ditampilkan sebagai toast (untuk proses latar belakang)
function api(fn, args, ok, fail, silent) {

      if (msg === 'SESI_HABIS') { toast('Sesi kamu habis, silakan login ulang', 'warn'); doLogout(true); return; }

// Infinite scroll + server-side pagination
function Lister(cfg) {
  var L = { offset: 0, loading: false, done: false, req: 0, items: [] };
  var box = $(cfg.box);
  var sen = document.createElement('div');
  box.parentNode.insertBefore(sen, box.nextSibling);
  L.reset = function () {
    L.offset = 0; L.done = false; L.items = []; L.req++; L.loading = false;
    box.innerHTML = skel(5);
    L.load();
  };
  L.load = function () {
    if (L.loading || L.done) return;
    L.loading = true;
    sen.innerHTML = L.offset > 0 ? '<div class="more"><span class="spin dark"></span>Memuat data...</div>' : '';
    var myReq = L.req;
    var p = cfg.params ? cfg.params() : {};
    p.offset = L.offset;
    p.limit = 20;
    api(cfg.fn, [S.token, p], function (d) {
      if (myReq !== L.req) return;
      L.loading = false;
      sen.innerHTML = '';
      var first = L.offset === 0;
      if (first) box.innerHTML = '';
      var html = '';
      for (var i = 0; i < d.items.length; i++) { L.items.push(d.items[i]); html += cfg.render(d.items[i]); }
      box.insertAdjacentHTML('beforeend', html);
      L.offset += d.items.length;
      L.done = !d.hasMore;
      if (!L.items.length) box.innerHTML = emptyState(cfg.empty || 'Belum ada data', cfg.emptyIc);
      if (cfg.onData) cfg.onData(d, first);
    }, function () {
      if (myReq !== L.req) return;
      L.loading = false;
      sen.innerHTML = '';
      if (L.offset === 0) box.innerHTML = emptyState(S.preview ? 'Mode preview: data tampil setelah deploy' : 'Gagal memuat data', 'alert');
    });
  };
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { if (en[0].isIntersecting && L.offset > 0 && !L.done) L.load(); }, { rootMargin: '300px' }).observe(sen);
  }
  return L;
}

// ==================== KALENDER ====================
function renderCal(elId, events, onPick) {
  var st = S.cals[elId];
  if (!st) { var n = new Date(); st = S.cals[elId] = { y: n.getFullYear(), m: n.getMonth(), sel: '' }; }
  st.onPick = onPick;
  var map = {};
  (events || []).forEach(function (e) { (map[e.tgl] = map[e.tgl] || []).push(e); });
  var y = st.y, m = st.m;
  var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), prev = new Date(y, m, 0).getDate();
  var today = ymd(new Date());
  var h = '<div class="cal-head"><b>' + BULAN[m] + ' ' + y + '</b><div>' +
    '<button type="button" class="icon-btn sm" onclick="calNav(' + arg(elId) + ',-1)" aria-label="Bulan sebelumnya">' + ic('left', 16) + '</button>' +
    '<button type="button" class="icon-btn sm" onclick="calNav(' + arg(elId) + ',1)" aria-label="Bulan berikutnya">' + ic('right', 16) + '</button></div></div><div class="cal-grid">';
  HARI.forEach(function (d) { h += '<span class="cal-dow">' + d + '</span>'; });
  for (var i = first - 1; i >= 0; i--) h += '<span class="cal-d muted">' + (prev - i) + '</span>';
  for (var d = 1; d <= days; d++) {
    var key = y + '-' + pad2(m + 1) + '-' + pad2(d);
    var ev = map[key] || [], tipe = {};
    ev.forEach(function (e) { tipe[e.tipe] = 1; });
    var dots = Object.keys(tipe).slice(0, 3).map(function (t) { return '<b class="d-' + t + '"></b>'; }).join('');
    var cls = 'cal-d' + (key === today ? ' today' : '') + (key === st.sel ? ' sel' : '');
    h += '<button type="button" class="' + cls + '" onclick="calPick(' + arg(elId) + ',' + arg(key) + ')">' + d + (dots ? '<span class="dots">' + dots + '</span>' : '') + '</button>';
  }
  var sisa = (7 - (first + days) % 7) % 7;
  for (var k = 1; k <= sisa; k++) h += '<span class="cal-d muted">' + k + '</span>';
  $(elId).innerHTML = h + '</div>';
}
function calNav(elId, step) {
  var st = S.cals[elId];
  st.m += step;
  if (st.m < 0) { st.m = 11; st.y--; }
  if (st.m > 11) { st.m = 0; st.y++; }
  renderCal(elId, S.events, st.onPick);
}
function calPick(elId, key) {
  var st = S.cals[elId];
  st.sel = key;
  renderCal(elId, S.events, st.onPick);
  if (st.onPick) st.onPick(key);
}
function eventsOn(key) { return S.events.filter(function (e) { return e.tgl === key; }); }
var EV_WARNA = { tempo: '#22C55E', undian: '#8B5CF6', telat: '#E5484D', selesai: '#CBD5E1' };
function evItem(e) { return '<div class="ev"><i style="background:' + (EV_WARNA[e.tipe] || '#ccc') + '"></i><div><b>' + esc(e.grup) + '</b><small>' + esc(e.judul) + '</small></div></div>'; }
function labelTgl(key) { var p = key.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return tglPanjang(d); }
function dashPick(key) {
  var ev = eventsOn(key);
  openModal(labelTgl(key), ev.length ? '<div style="padding-top:14px">' + ev.map(evItem).join('') + '</div>' : emptyState('Tidak ada jadwal di tanggal ini', 'calendar'));
}

function konfirmKocok() {
  var d = S.undian;
  var hanya = $('uLunas') && $('uLunas').checked;
  confirmBox('Mulai Undian?', 'Undian putaran ' + d.putaran + ' untuk grup ' + d.grup.Nama_Grup + ' akan dilakukan. Hasil undian tidak bisa dibatalkan.', 'Ya, Mulai Undian', function () { kocok(hanya); });
}
function kocok(hanyaLunas) {
  var d = S.undian;
  var nama = d.kandidat.filter(function (k) { return !hanyaLunas || k.lunas; }).map(function (k) { return k.Nama_Peserta; });
  if (!nama.length) nama = d.kandidat.map(function (k) { return k.Nama_Peserta; });
  var ov = $('draw');
  ov.classList.remove('hidden');
  requestAnimationFrame(function () { ov.classList.add('show'); });
  $('drawSub').textContent = 'Mengocok nama peserta ' + d.grup.Nama_Grup + '...';
  $('drawRes').classList.add('hidden');
  $('drawIc').style.display = '';
  var nm = $('drawName');
  nm.className = 'draw-name';
  var i = 0;
  var putar = setInterval(function () { nm.textContent = nama[i++ % nama.length]; }, 70);
  api('lakukanUndian', [S.token, d.grup.ID_Grup, !!hanyaLunas], function (r) {
    clearInterval(putar);
    // Perlambat lalu berhenti di pemenang
    var langkah = 0, total = 14;
    var pool = r.kandidat.length ? r.kandidat : nama;
    function tick() {
      if (langkah < total) {
        nm.textContent = pool[(i++) % pool.length];
        langkah++;
        setTimeout(tick, 80 + langkah * langkah * 4);
      } else {
        nm.textContent = r.pemenang.Nama;
        nm.className = 'draw-name win';
        $('drawSub').textContent = '🎉 Selamat kepada pemenang putaran ' + r.putaran + '!';
        $('drawIc').style.display = 'none';
        $('drawRes').innerHTML = '<div class="glass"><div class="kv"><span>Grup</span><b>' + esc(d.grup.Nama_Grup) + '</b></div><div class="kv"><span>Putaran</span><b>' + r.putaran + '</b></div><div class="kv"><span>Total dana</span><b>' + rp(r.totalDana) + '</b></div><div class="kv"><span>ID Undian</span><b>' + esc(r.undian.ID_Undian) + '</b></div></div>' +
          '<button class="btn btn-pri" style="background:#fff;color:var(--pri)" onclick="tutupDraw()">Tutup</button>';
        $('drawRes').classList.remove('hidden');
        confetti();
        // Optimistic: tambah ke riwayat tanpa refetch
        var ul = $('uList');
        if (ul.querySelector('.empty')) ul.innerHTML = '';
        ul.insertAdjacentHTML('afterbegin', undianRow(r.undian));
        S.grups = null;
        if (r.selesai) toast('Grup ' + d.grup.Nama_Grup + ' telah menyelesaikan semua putaran 🎊', 'ok');
      }
    }
    tick();
  }, function () { clearInterval(putar); tutupDraw(); });
}
function tutupDraw() {
  var ov = $('draw');
  ov.classList.remove('show');
  setTimeout(function () { ov.classList.add('hidden'); }, 300);
  if (S.page === 'undian') initUndian();
}
function confetti() {
  var warnaC = ['#22C55E', '#7CFFB2', '#F5C451', '#EF5466', '#6366F1', '#ffffff'];
  for (var i = 0; i < 90; i++) {
    var c = document.createElement('div');
    c.className = 'cf';
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.background = warnaC[i % warnaC.length];
    c.style.animationDuration = (2.2 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * 0.6) + 's';
    c.style.transform = 'rotate(' + Math.round(Math.random() * 360) + 'deg)';
    document.body.appendChild(c);
    (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 5200); })(c);
  }
}

      '<button class="btn btn-sm" type="button" onclick="salinRek(' + arg(s.No_Rekening || '') + ')">' + ic('copy', 14) + 'Salin No. Rekening</button>';
    var bisa = d.grup.filter(function (g) { return g.bisaSetor; });
    $('psGrupSel').innerHTML = bisa.length ? bisa.map(function (g) { return '<option value="' + esc(g.ID_Grup) + '">' + esc(g.Nama_Grup) + '</option>'; }).join('') : '<option value="">Tidak ada tagihan saat ini 🎉</option>';
    if (idGrup) $('psGrupSel').value = idGrup;
    $('btnSetor').disabled = !bisa.length;
    UPL.ps = '';
    $('psUpl').innerHTML = uplHtml('ps', 'Foto struk / bukti transfer • otomatis dikompres');
    onMetodeP();
    onSetorGrup();
  };
  if (S.pdash) tampil(S.pdash);
  else api('getPesertaDashboard', [S.token], function (d) { S.pdash = d; tampil(d); }, function () { tampil({ grup: [], settings: {} }); });
}
function onSetorGrup() {
  var id = $('psGrupSel').value;
  var g = S.pdash ? S.pdash.grup.filter(function (x) { return x.ID_Grup === id; })[0] : null;
  $('psSum').innerHTML = g ? '<div><small>Nominal</small><b>' + rp(g.Nominal_Setoran) + '</b></div><div><small>Putaran</small><b>' + g.putaranTampil + ' / ' + g.slot + '</b></div><div><small>Jatuh tempo</small><b>' + esc(g.nextUndian) + '</b></div><div><small>Status</small>' + badge(g.statusSaya) + '</div>'
    : '<div style="grid-column:1/-1"><small>Semua setoran kamu sudah beres. Mantap! 💚</small></div>';
}
function onMetodeP() {
  var transfer = radioVal('psMetode') !== 'Tunai';
  $('psStrukReq').textContent = transfer ? '*wajib untuk transfer' : '(opsional)';
  $('psStrukReq').style.color = transfer ? 'var(--red)' : 'var(--mut)';
  var u = $('upl-ps');
  if (u) u.classList.toggle('req', transfer);
}
function salinRek(no) {
  try { navigator.clipboard.writeText(no).then(function () { toast('No. rekening disalin', 'ok'); }, function () { toast('No. rekening: ' + no, 'info'); }); }
  catch (e) { toast('No. rekening: ' + no, 'info'); }
}
function kirimSetoranP() {
  var id = $('psGrupSel').value;
  if (!id) { toast('Tidak ada grup yang perlu disetor', 'info'); return; }
  if (S.preview) { toast('Mode preview: tidak tersimpan', 'info'); return; }
  var g = S.pdash.grup.filter(function (x) { return x.ID_Grup === id; })[0];
  var d = { idGrup: id, metode: radioVal('psMetode'), catatan: $('psCatatan').value.trim(), struk: UPL.ps || '' };
  if (d.metode !== 'Tunai' && !d.struk) {
    toast('Lampirkan foto struk / bukti transfer dulu ya 📸', 'warn');
    var u = $('upl-ps');
    if (u) { u.scrollIntoView({ behavior: 'smooth', block: 'center' }); u.querySelector('.upl-drop').focus(); }
    return;
  }
  confirmBox('Kirim Setoran?', 'Konfirmasi setoran ' + rp(g.Nominal_Setoran) + ' untuk ' + g.Nama_Grup + ' (putaran ' + g.putaranTampil + ')' + (d.struk ? ' beserta foto struk.' : '.'), 'Kirim', function () {
    btnBusy('btnSetor', true, d.struk ? 'Mengunggah struk...' : 'Mengirim...');
    // Optimistic UI: status grup langsung jadi Menunggu
    var lamaSt = g.statusSaya, lamaB = g.bisaSetor;
    g.statusSaya = 'Menunggu Verifikasi'; g.bisaSetor = false;
    api('kirimSetoran', [S.token, d], function (o) {
      btnBusy('btnSetor', false);
      $('psCatatan').value = '';
      uplHapus('ps');
      if (S.L.riwayat) S.L.riwayat.done = false;
      toast('Setoran terkirim (' + o.ID_Transaksi + '). Menunggu verifikasi admin ⏳', 'ok');
      goP('riwayat');
    }, function () { btnBusy('btnSetor', false); g.statusSaya = lamaSt; g.bisaSetor = lamaB; });
  });
}
function initRiwayat() {
  if (!S.L.riwayat) S.L.riwayat = Lister({ box: 'psRiwayat', fn: 'listSetoranSaya', render: riwayatRow, empty: 'Belum ada riwayat setoran', emptyIc: 'list' });
  S.L.riwayat.reset();
}
function riwayatRow(t) {
  S.obj['s_' + t.ID_Transaksi] = t;
  var kiri = t.Bukti_Struk ? thumbStruk(t, 'riwayat') : '<span class="hic" style="width:38px;height:38px;border-radius:12px">' + ic('wallet', 18) + '</span>';
  return '<div class="tl" style="padding:14px 18px">' + kiri +
    '<div class="c2"><b>' + esc(t.Nama_Grup) + ' • P' + t.Putaran_Ke + '</b><small>' + esc(t.ID_Transaksi) + ' • ' + esc(t.Tanggal) + '</small>' +
    (t.Status === 'Ditolak' && t.Alasan_Tolak ? '<small style="color:var(--red);display:block">Alasan: ' + esc(t.Alasan_Tolak) + '</small>' : '') + '</div>' +
    '<div style="text-align:right"><b style="font-size:13px;display:block">' + rp(t.Nominal) + '</b>' + badge(t.Status) +
    (t.Status === 'Lunas' ? '<button class="link" style="display:flex;margin:6px 0 0 auto;font-size:12px;gap:4px" onclick="unduhKw(' + arg(t.ID_Transaksi) + ')">' + ic('download', 12) + 'Kwitansi</button>' : '') +
    '</div></div>';
}
function renderProfil() {
  var u = S.pdash ? S.pdash.user : { Nama: S.user ? S.user.nama : '-', ID_User: S.user ? S.user.id : '-', No_HP: S.user ? S.user.hp : '-' };
  $('psProf').innerHTML = '<div class="prof-av">' + av(u.Nama, 76, S.user ? S.user.foto : '') +
    '<button class="cam" type="button" onclick="formFoto()" title="Ganti foto profil" aria-label="Ganti foto profil">' + ic('camera', 14) + '</button></div>' +
    '<h3>' + esc(u.Nama) + '</h3><p class="mut small" style="margin-top:4px">Peserta Arisan Berjaya</p>';
  $('psProfInfo').innerHTML = '<div class="kv"><span>ID Peserta</span><b>' + esc(u.ID_User) + '</b></div><div class="kv"><span>No. HP</span><b>' + esc(u.No_HP) + '</b></div>' +
    '<div class="kv"><span>Alamat</span><b>' + esc(u.Alamat || '-') + '</b></div><div class="kv"><span>Terdaftar</span><b>' + esc(String(u.Tanggal_Daftar || '-').slice(0, 10)) + '</b></div>' +
    '<div class="kv"><span>Grup diikuti</span><b>' + (S.pdash ? S.pdash.grup.length : 0) + '</b></div>';
}
</script>
